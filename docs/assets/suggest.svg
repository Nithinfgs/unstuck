<svg xmlns="http://www.w3.org/2000/svg" width="1039" height="300" viewBox="0 0 1039 300" role="img" aria-label="unstuck suggest">
<title>unstuck suggest</title>
<rect width="1039" height="300" rx="12" fill="#0d1117"/>
<rect width="1039" height="36" rx="12" fill="#161b22"/><rect y="24" width="1039" height="12" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="519.5" y="22" fill="#8b949e" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">unstuck suggest</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14">
<text x="24" y="58" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> npx unstuck suggest</text>
<text x="24" y="98" xml:space="preserve"><tspan fill="#8b949e">&lt;!-- unstuck:start --&gt;</tspan></text>
<text x="24" y="118" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">## Learned from past agent sessions</tspan></text>
<text x="24" y="138" xml:space="preserve"></text>
<text x="24" y="158" xml:space="preserve"><tspan fill="#8b949e">&lt;!-- Generated by unstuck from local session logs. Review each line before keeping it. --&gt;</tspan></text>
<text x="24" y="178" xml:space="preserve"><tspan fill="#e6edf3">- Run </tspan><tspan fill="#56d4dd">pnpm test</tspan><tspan fill="#e6edf3"> instead of </tspan><tspan fill="#56d4dd">npm test</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#56d4dd">npm</tspan><tspan fill="#e6edf3"> failed: sh: 1: vitest: not found). Seen 2× in 2 sessions.</tspan></text>
<text x="24" y="198" xml:space="preserve"><tspan fill="#e6edf3">- Run </tspan><tspan fill="#56d4dd">docker compose -f deploy/compose.dev.yml up -d db</tspan><tspan fill="#e6edf3"> instead of </tspan><tspan fill="#56d4dd">docker compose up -d db</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#56d4dd">docker</tspan><tspan fill="#e6edf3"> failed: no configuration file provided: not found). Seen 2× in 2 sessions.</tspan></text>
<text x="24" y="218" xml:space="preserve"><tspan fill="#e6edf3">- Rule candidate: "no, use pnpm not npm in this repo" (you said this 2×).</tspan></text>
<text x="24" y="238" xml:space="preserve"><tspan fill="#e6edf3">- </tspan><tspan fill="#56d4dd">pnpm test</tspan><tspan fill="#e6edf3"> prints a lot (~40k tokens over 4 calls). Prefer a quiet flag or pipe through </tspan><tspan fill="#56d4dd">tail -n 40</tspan><tspan fill="#e6edf3">.</tspan></text>
<text x="24" y="258" xml:space="preserve"><tspan fill="#8b949e">&lt;!-- unstuck:end --&gt;</tspan></text>
</g></svg>
