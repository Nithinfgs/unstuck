name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Demo runs end to end
        run: node bin/unstuck.js --demo --no-color
      - name: Demo assets are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm run build:demo
          npm run build:assets
          git diff --exit-code -- examples docs/assets
