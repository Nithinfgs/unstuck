name: Support another agent
description: Ask for (or offer) an adapter for another agent's session logs
labels: [adapter]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where it stores logs
      placeholder: ~/.something/sessions/*.jsonl
  - type: textarea
    id: sample
    attributes:
      label: A few anonymized lines of the format
      description: Replace prompts, paths and secrets with placeholders.
      render: json
