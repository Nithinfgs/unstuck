name: Bug report
description: Something crashed or behaved incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: unstuck 0.1.0, Node 22, macOS 15
    validations:
      required: true
